[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docmind-ft"
version = "0.1.0"
description = "QLoRA fine-tune of a small LLM for citation-grounded answering over retrieved text (Project 8, DocMind ecosystem)."
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored files are verbatim P7 copies; linting or formatting them would
# break the byte-exact vendor check (scripts/check_vendor.py).
exclude = ["docmind_ft/vendor", "evaluation/paper16/questions.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"docmind_ft/vendor/*" = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
